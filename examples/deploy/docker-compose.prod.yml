services:
  mysql:
    image: mysql:8.4
    container_name: luckycolor-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: 123456
      MYSQL_DATABASE: luckycolor_admin
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - ./data/mysql:/var/lib/mysql
    ports:
      - "3306:3306"

  redis:
    image: redis:7-alpine
    container_name: luckycolor-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - ./data/redis:/data
    ports:
      - "6379:6379"

  server:
    build:
      context: ../../../luckyColor-admin-serve
      dockerfile: ../luckyColor-docs/examples/deploy/server.Dockerfile
    container_name: luckycolor-server
    restart: unless-stopped
    environment:
      PORT: 3001
      DATABASE_URL: mysql://root:123456@mysql:3306/luckycolor_admin?charset=utf8mb4
      JWT_SECRET: replace-with-a-strong-secret
      JWT_EXPIRES_IN: 2h
      REDIS_URL: redis://redis:6379
      SWAGGER_ENABLED: "true"
      LOGIN_CAPTCHA_ENABLED: "true"
      TENANT_ENABLED: "true"
      TENANT_HEADER: x-tenant-id
      DEFAULT_TENANT_ID: tenant_001
      DEFAULT_ADMIN_USERNAME: admin
      DEFAULT_ADMIN_PASSWORD: 123456
      APP_TIME_ZONE: +08:00
    depends_on:
      - mysql
      - redis
    ports:
      - "3001:3001"

  admin:
    build:
      context: ../../../luckyColor-admin
      dockerfile: ../luckyColor-docs/examples/deploy/admin.Dockerfile
    container_name: luckycolor-admin
    restart: unless-stopped
    depends_on:
      - server
    ports:
      - "8080:80"

  nginx:
    image: nginx:1.27-alpine
    container_name: luckycolor-nginx
    restart: unless-stopped
    depends_on:
      - admin
      - server
    volumes:
      - ./examples/deploy/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./examples/deploy/nginx/https.conf:/etc/nginx/conf.d/https.conf:ro
      - ./data/logs/nginx:/var/log/nginx
    ports:
      - "80:80"
      - "443:443"

