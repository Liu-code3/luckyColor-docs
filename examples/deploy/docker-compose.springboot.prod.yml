services:
  mysql:
    image: mysql:8.4
    container_name: luckycolor-sb-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: 123456
      MYSQL_DATABASE: luckycolor_admin_sb
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - ./data/mysql:/var/lib/mysql
    ports:
      - "3306:3306"

  redis:
    image: redis:7-alpine
    container_name: luckycolor-sb-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - ./data/redis:/data
    ports:
      - "6379:6379"

  server:
    build:
      context: ../../../luckycolor-admin-springboot
      dockerfile: ../luckyColor-docs/examples/deploy/server.springboot.Dockerfile
    container_name: luckycolor-springboot-server
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SERVER_PORT: 3001
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: luckycolor_admin_sb
      DB_USERNAME: root
      DB_PASSWORD: 123456
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_DATABASE: 0
      JWT_SECRET: replace-with-a-strong-secret
      FLYWAY_ENABLED: "true"
      LOGIN_CAPTCHA_ENABLED: "true"
      SPRINGDOC_SWAGGER_UI_ENABLED: "true"
      SPRINGDOC_API_DOCS_ENABLED: "true"
      TENANT_ENABLED: "true"
      TENANT_HEADER: x-tenant-id
      DEFAULT_TENANT_ID: tenant_001
      STORAGE_ROOT_PATH: /data/storage
    depends_on:
      - mysql
      - redis
    volumes:
      - ./data/storage:/data/storage
    ports:
      - "3001:3001"

  admin:
    build:
      context: ../../../luckyColor-admin
      dockerfile: ../luckyColor-docs/examples/deploy/admin.Dockerfile
    container_name: luckycolor-admin
    restart: unless-stopped
    depends_on:
      - server
    ports:
      - "8080:80"

  nginx:
    image: nginx:1.27-alpine
    container_name: luckycolor-sb-nginx
    restart: unless-stopped
    depends_on:
      - admin
      - server
    volumes:
      - ./examples/deploy/nginx/default.springboot.conf:/etc/nginx/conf.d/default.conf:ro
      - ./examples/deploy/nginx/https.springboot.conf:/etc/nginx/conf.d/https.conf:ro
      - ./data/logs/nginx:/var/log/nginx
    ports:
      - "80:80"
      - "443:443"
